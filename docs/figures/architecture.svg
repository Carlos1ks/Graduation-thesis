<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box{fill:#f7f9fb;stroke:#2d6cdf;stroke-width:2;}
    .small{fill:#fff;stroke:#9aaedc;stroke-width:1}
    .title{font: bold 16px "Microsoft YaHei"; fill:#123;} 
    .label{font:14px "Microsoft YaHei"; fill:#0b2540}
    .note{font:12px "Microsoft YaHei"; fill:#254}
  </style>
  <rect x="40" y="30" width="220" height="80" rx="8" class="box"/>
  <text x="150" y="62" class="title" text-anchor="middle">前端交互层</text>
  <text x="150" y="82" class="label" text-anchor="middle">React + Vite 会话界面</text>

  <rect x="340" y="30" width="260" height="80" rx="8" class="box"/>
  <text x="470" y="62" class="title" text-anchor="middle">后端服务层</text>
  <text x="470" y="82" class="label" text-anchor="middle">Flask：解析/代理/接口编排</text>

  <rect x="680" y="30" width="180" height="80" rx="8" class="box"/>
  <text x="770" y="62" class="title" text-anchor="middle">外部服务</text>
  <text x="770" y="82" class="label" text-anchor="middle">模型/图像识别/数据库</text>

  <rect x="120" y="180" width="660" height="160" rx="8" class="small"/>
  <text x="150" y="210" class="title">多智能体协同层</text>
  <text x="300" y="235" class="label">态势感知</text>
  <text x="470" y="235" class="label">知识检索</text>
  <text x="640" y="235" class="label">决策推理</text>
  <text x="470" y="260" class="label">协同指挥 / 聚合器</text>

  <!-- 箭头 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6cdf" />
    </marker>
  </defs>
  <line x1="260" y1="70" x2="340" y2="70" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="70" x2="680" y2="70" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="110" x2="200" y2="180" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="470" y1="110" x2="470" y2="180" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="770" y1="110" x2="770" y2="180" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrow)" />

  <text x="40" y="380" class="note">图1 系统总体架构（工程实现视角）</text>
</svg>